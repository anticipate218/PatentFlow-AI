name: Online health
on:
  schedule:
    # Beijing time 00:00, 06:00, 12:00 and 18:00. GitHub schedules may be delayed.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/site-health.mjs
        env:
          BASE: https://patentflow-ai.patentflow-ai.workers.dev
